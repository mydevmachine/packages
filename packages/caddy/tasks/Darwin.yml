---
# Homebrew refuses to run as root, and root is what this play runs as on a Mac
# reached over SSH, so the install becomes the account that owns Homebrew.
- name: Find who owns Homebrew
  ansible.builtin.stat:
    path: "{{ devmachine_caddy_brew_prefix }}/bin/brew"
  register: devmachine_caddy_brew
  when: ansible_facts['pkg_mgr'] == 'homebrew'

- name: Install Caddy from Homebrew
  community.general.homebrew:
    name: caddy
    state: present
    path: "{{ devmachine_caddy_brew_prefix }}/bin"
  become: "{{ devmachine_caddy_brew.stat.uid != ansible_facts['effective_user_id'] }}"
  become_user: "{{ devmachine_caddy_brew.stat.pw_name }}"
  when: ansible_facts['pkg_mgr'] == 'homebrew'

- name: Install Caddy from MacPorts
  ansible.builtin.package:
    name: caddy
    state: present
  when: ansible_facts['pkg_mgr'] != 'homebrew'

- name: Create the directory Caddy keeps its certificates in
  ansible.builtin.file:
    path: "{{ devmachine_caddy_state_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0700"
