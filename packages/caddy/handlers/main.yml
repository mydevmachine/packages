---
- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  when:
    - not ansible_check_mode
    - ansible_facts['system'] != 'Darwin'

# Through Caddy's admin endpoint, which is what systemd's reload calls too.
- name: Reload caddy on macOS
  ansible.builtin.command:
    argv: ["{{ devmachine_caddy_bin }}", reload, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
  changed_when: true
  when:
    - not ansible_check_mode
    - ansible_facts['system'] == 'Darwin'
  listen: Reload caddy

# A changed plist is only read when the job is loaded again.
- name: Load caddy's launchd job again
  # bootstrap right after bootout can fail with "Input/output error" while
  # launchd is still taking the old job down, so it is tried a few times.
  ansible.builtin.shell: >-
    launchctl bootout system/{{ devmachine_caddy_launchd_label }} 2>/dev/null;
    for try in 1 2 3 4 5; do
    launchctl bootstrap system {{ devmachine_caddy_launchd_plist }} && exit 0;
    sleep 1; done; exit 1
  changed_when: true
  when: not ansible_check_mode
