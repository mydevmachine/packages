---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home, group and shell
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# A dry run on a machine where this account does not exist yet cannot become
# it, so every task below that runs as the account asks first.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_scheduled_home }}"
  register: devmachine_scheduled_account
  check_mode: false

- name: Make the scheduled folder
  ansible.builtin.file:
    path: "{{ devmachine_scheduled_dir }}"
    state: directory
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0700"
  when: devmachine_scheduled_account.stat.exists

# The CLI that syncs passes its own release, so the Mac and the workspace
# read the same JSON. A CLI built from source has no release to download.
- name: Choose the devmachine release
  ansible.builtin.set_fact:
    devmachine_scheduled_wanted: >-
      {{ devmachine_scheduled_version
         or devmachine_cli_version | default('')
         or devmachine_scheduled_fallback_version }}

- name: Read the installed version
  ansible.builtin.command: "{{ devmachine_scheduled_binary }} version"
  register: devmachine_scheduled_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: devmachine_scheduled_account.stat.exists

# A dry run has nothing downloaded to unpack, so it reads the version only.
- name: Install devmachine for the scheduled tasks
  when:
    - not ansible_check_mode
    - devmachine_scheduled_account.stat.exists
    - (devmachine_scheduled_installed.stdout | default('') | regex_search('\d+\.\d+\.\d+') | default('', true))
      != (devmachine_scheduled_wanted | trim | regex_replace('^v', ''))
  vars:
    devmachine_scheduled_architectures:
      x86_64: amd64
      aarch64: arm64
      arm64: arm64
    devmachine_scheduled_release: "{{ devmachine_scheduled_wanted | trim | regex_replace('^v', '') }}"
    devmachine_scheduled_asset: >-
      devmachine_{{ devmachine_scheduled_release }}_{{ ansible_facts['system'] | lower }}_{{
      devmachine_scheduled_architectures.get(ansible_facts['architecture'], ansible_facts['architecture']) }}.tar.gz
    devmachine_scheduled_base: "{{ devmachine_scheduled_release_url }}/v{{ devmachine_scheduled_release }}"
  block:
    - name: Make a place to download the release
      ansible.builtin.tempfile:
        state: directory
      register: devmachine_scheduled_tmp

    - name: Download the release and check it against its checksums
      ansible.builtin.get_url:
        url: "{{ devmachine_scheduled_base }}/{{ devmachine_scheduled_asset }}"
        dest: "{{ devmachine_scheduled_tmp.path }}/{{ devmachine_scheduled_asset }}"
        checksum: "sha256:{{ devmachine_scheduled_base }}/checksums.txt"
        mode: "0644"

    # unarchive wants GNU tar and fails on macOS, whose tar is bsdtar. Both
    # read this command line the same way.
    - name: Unpack the release
      ansible.builtin.command:
        argv:
          - tar
          - -xzf
          - "{{ devmachine_scheduled_tmp.path }}/{{ devmachine_scheduled_asset }}"
          - -C
          - "{{ devmachine_scheduled_tmp.path }}"
          - devmachine
        creates: "{{ devmachine_scheduled_tmp.path }}/devmachine"

    # Its own path, never on the account's PATH: the devmachine the person
    # may run by hand stays whatever they installed.
    - name: Put the binary where the timer and the Mac call it
      ansible.builtin.copy:
        src: "{{ devmachine_scheduled_tmp.path }}/devmachine"
        dest: "{{ devmachine_scheduled_binary }}"
        remote_src: true
        owner: "{{ devmachine_workspace.user }}"
        group: "{{ devmachine_account.group | default(omit) }}"
        mode: "0755"
  always:
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ devmachine_scheduled_tmp.path }}"
        state: absent
      when: devmachine_scheduled_tmp.path is defined

- name: Run the timer through systemd
  ansible.builtin.import_tasks: Linux.yml
  when: ansible_facts['system'] == 'Linux'

- name: Run the timer through launchd
  ansible.builtin.import_tasks: Darwin.yml
  when: ansible_facts['system'] == 'Darwin'
