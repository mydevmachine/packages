---
- name: Refuse a machine that is not macOS
  ansible.builtin.fail:
    msg: "mac-brew only runs on macOS, this machine reports {{ ansible_facts['system'] }}."
  when: ansible_facts['system'] != 'Darwin'

- name: Look for Homebrew
  ansible.builtin.stat:
    path: "{{ devmachine_mac_brew_prefix }}/bin/brew"
  register: devmachine_mac_brew_bin

- name: Refuse a machine without Homebrew
  ansible.builtin.fail:
    msg: >-
      Homebrew is not installed at {{ devmachine_mac_brew_prefix }}. Install it
      from https://brew.sh, then run `devmachine setup` for this machine.
  when: not devmachine_mac_brew_bin.stat.exists

# Homebrew refuses to run as root. On the operator's own Mac the play already
# runs as the owner; on a Mac reached over SSH it runs as root, so every brew
# call becomes the account that installed Homebrew.
- name: Find who owns Homebrew
  ansible.builtin.set_fact:
    devmachine_mac_brew_owner: "{{ devmachine_mac_brew_bin.stat.pw_name }}"
    devmachine_mac_brew_become: "{{ devmachine_mac_brew_bin.stat.uid != ansible_facts['effective_user_id'] }}"

# Taps come before formulae and casks: without them a cask from an own tap
# fails with "No available cask with the name ..." on a clean Mac.
- name: Add the taps
  community.general.homebrew_tap:
    name: "{{ devmachine_mac_brew_taps }}"
    state: present
    path: "{{ devmachine_mac_brew_prefix }}/bin"
  when: devmachine_mac_brew_taps | length > 0
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Find which formulae are missing
  ansible.builtin.command:
    argv: "{{ [devmachine_mac_brew_prefix ~ '/bin/brew', 'list', '--formula', '--versions'] + devmachine_mac_brew_formulae }}"
  register: devmachine_mac_brew_formulae_listed
  changed_when: false
  failed_when: false
  check_mode: false
  when: devmachine_mac_brew_formulae | length > 0
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Find which casks are missing
  ansible.builtin.command:
    argv: "{{ [devmachine_mac_brew_prefix ~ '/bin/brew', 'list', '--cask', '--versions'] + devmachine_mac_brew_casks }}"
  register: devmachine_mac_brew_casks_listed
  changed_when: false
  failed_when: false
  check_mode: false
  when: devmachine_mac_brew_casks | length > 0
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

# A brew with old code fails on today's formulae (e.g. "unknown keyword"). Update
# only when something is missing, so a sync with nothing to install stays unchanged.
- name: Update Homebrew before installing
  ansible.builtin.command:
    argv: ["{{ devmachine_mac_brew_prefix }}/bin/brew", update]
  changed_when: false
  when:
    - not ansible_check_mode
    - >-
      (devmachine_mac_brew_formulae | map('regex_replace', '^.*/', '') | difference(devmachine_mac_brew_formulae_listed.stdout_lines | default([]) | map('regex_replace', ' .*$', '')) | length > 0)
      or (devmachine_mac_brew_casks | map('regex_replace', '^.*/', '') | difference(devmachine_mac_brew_casks_listed.stdout_lines | default([]) | map('regex_replace', ' .*$', '')) | length > 0)
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Install the formulae
  community.general.homebrew:
    name: "{{ devmachine_mac_brew_formulae }}"
    state: present
    path: "{{ devmachine_mac_brew_prefix }}/bin"
  when: devmachine_mac_brew_formulae | length > 0
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Read the trust file
  ansible.builtin.slurp:
    path: ~/.homebrew/trust.json
  register: devmachine_mac_brew_trust_file
  failed_when: false
  changed_when: false
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Decode the trust file
  ansible.builtin.set_fact:
    devmachine_mac_brew_trusted_casks_known: >-
      {{ (devmachine_mac_brew_trust_file.content | default('e30=') | b64decode | from_json).trustedcasks | default([]) }}
    devmachine_mac_brew_trusted_formulae_known: >-
      {{ (devmachine_mac_brew_trust_file.content | default('e30=') | b64decode | from_json).trustedformulae | default([]) }}

# Trust comes before the casks: a clean Mac fails with "Refusing to load cask
# ... from untrusted tap" even with the tap already added.
- name: Trust the casks
  ansible.builtin.command: "{{ devmachine_mac_brew_prefix }}/bin/brew trust --cask {{ item }}"
  loop: "{{ devmachine_mac_brew_trusted_casks }}"
  when: item not in devmachine_mac_brew_trusted_casks_known
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Trust the formulae
  ansible.builtin.command: "{{ devmachine_mac_brew_prefix }}/bin/brew trust --formula {{ item }}"
  loop: "{{ devmachine_mac_brew_trusted_formulae }}"
  when: item not in devmachine_mac_brew_trusted_formulae_known
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"

- name: Install the casks
  community.general.homebrew_cask:
    name: "{{ devmachine_mac_brew_casks }}"
    state: present
    path: "{{ devmachine_mac_brew_prefix }}/bin"
  when: devmachine_mac_brew_casks | length > 0
  become: "{{ devmachine_mac_brew_become }}"
  become_user: "{{ devmachine_mac_brew_owner }}"
