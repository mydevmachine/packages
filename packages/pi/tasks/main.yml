---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# macOS ships curl, tar and unzip. Homebrew would also refuse the root this
# play runs as on a Mac reached over SSH.
- name: Install what the release is downloaded and unpacked with
  ansible.builtin.package:
    name:
      - curl
      - tar
    state: present
  when: ansible_facts['system'] != 'Darwin'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_pi_home }}"
  register: devmachine_pi_account
  check_mode: false

# The standalone release and not npm: it is one native program, so the
# process is called `pi` — which is how the Devmachine app tells a Pi session
# from any other node process — and it does not break when Node is upgraded.
# The binary reads the files unpacked beside it, so it stays in its own
# directory and ~/.local/bin only holds a link to it.
- name: Install Pi
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_pi_home }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL {{ devmachine_pi_url | quote }} -o "$tmp/pi.tar.gz"
      mkdir -p "$HOME/.local/share/pi" "$HOME/.local/bin"
      tar xzf "$tmp/pi.tar.gz" -C "$HOME/.local/share/pi" --strip-components=1
      ln -sfn "$HOME/.local/share/pi/pi" "$HOME/.local/bin/pi"
    creates: "{{ devmachine_pi_home }}/.local/share/pi/pi"
  vars:
    # Pi names its builds x64 and arm64. An architecture it has no build for
    # keeps its own name, so the download fails instead of fetching the wrong one.
    devmachine_pi_architectures:
      x86_64: x64
      aarch64: arm64
      arm64: arm64
    devmachine_pi_url: >-
      https://github.com/earendil-works/pi/releases/latest/download/pi-{{ ansible_facts['system'] | lower }}-{{
      devmachine_pi_architectures.get(ansible_facts['architecture'], ansible_facts['architecture']) }}.tar.gz
  when: not ansible_check_mode or devmachine_pi_account.stat.exists

# ~/.devmachine/shellenv is read by every shell, interactive or not. Other
# packages write this same block under the same marker, and writing it twice
# costs nothing: blockinfile finds it already there.
- name: Put the account's own tools on the PATH
  ansible.builtin.blockinfile:
    path: "{{ devmachine_pi_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — ~/.local/bin on PATH"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) PATH="$HOME/.local/bin:$PATH" ;;
      esac
      export PATH

- name: Take the line an older release wrote out of ~/.zshenv
  ansible.builtin.lineinfile:
    path: "{{ devmachine_pi_home }}/.zshenv"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: absent
