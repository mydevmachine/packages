format: 1
name: tailscale
scope: machine
platforms: [linux, macos]
category: Network
kind: vpn
summary: Joins the machine to a tailnet, so it is reachable without a public address.

requires:
  cli: ">= 0.5.0"

needs: [base]

variables:
  exit_node:
    summary: Advertise this machine as an exit node. Off unless asked for.
    default: false
  login_server:
    summary: The control server `devmachine login tailscale` joins. Empty means Tailscale's own; a URL means your own, such as Headscale.
    default: ""

network:
  prefix: tailscale
  resolve: bin/resolve
  join: bin/join
  self_name: bin/self-name

credentials:
  - name: tailscale
    kind: manual
    scope: machine
    shareable: false
    command: tailscale up
    stored_at: /var/lib/tailscale/tailscaled.state
