---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Create the keyring directory
  ansible.builtin.file:
    path: "{{ devmachine_tailscale_keyring | dirname }}"
    state: directory
    mode: "0755"

- name: Download Tailscale's own signing key
  ansible.builtin.get_url:
    url: "{{ devmachine_tailscale_key_url }}"
    dest: "{{ devmachine_tailscale_keyring }}"
    mode: "0644"

- name: Add Tailscale's own repository
  ansible.builtin.copy:
    dest: "{{ devmachine_tailscale_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ devmachine_tailscale_repo_line }}\n"
  register: devmachine_tailscale_repo

- name: Refresh the package cache
  ansible.builtin.command: "{{ devmachine_package_cache_command }}"
  register: devmachine_tailscale_cache
  changed_when: false
  failed_when:
    - devmachine_tailscale_cache.rc != 0
    - devmachine_tailscale_cache.stderr_lines | select('match', '^E:') | reject('search', devmachine_package_cache_tolerated) | list | length > 0
  when: devmachine_tailscale_repo is changed

- name: Warn that the cache refresh skipped Caddy's repository
  ansible.builtin.debug:
    msg: >-
      WARNING: apt refused Caddy's repository while refreshing the package
      cache, because it cannot check its signature. This is Caddy's problem,
      not this machine's: see https://github.com/caddyserver/dist/issues/130.
      Every other repository was refreshed.
  when:
    - devmachine_tailscale_cache.rc is defined
    - devmachine_tailscale_cache.rc != 0

- name: Install Tailscale
  ansible.builtin.package:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode

# Exit node: IPv4 and IPv6 forwarding has to be on in the host for tailscaled to
# route the peers' traffic (https://tailscale.com/kb/1103/exit-nodes). Off by
# default: routing somebody's traffic through their machine because they
# installed a VPN is the same rudeness as setting their timezone.
- name: Enable IP forwarding for the exit node
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    mode: "0644"
  register: devmachine_tailscale_sysctl
  when: devmachine_tailscale_exit_node | bool

- name: Reload the tailscale sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
  when: devmachine_tailscale_sysctl is changed
  changed_when: false
