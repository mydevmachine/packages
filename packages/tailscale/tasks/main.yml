---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Add Tailscale's own repository on Debian and Ubuntu
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Tailscale
  ansible.builtin.package:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode

# Exit node: IPv4 and IPv6 forwarding has to be on in the host for tailscaled to
# route the peers' traffic (https://tailscale.com/kb/1103/exit-nodes). Off by
# default: routing somebody's traffic through their machine because they
# installed a VPN is the same rudeness as setting their timezone.
- name: Enable IP forwarding for the exit node
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    mode: "0644"
  register: devmachine_tailscale_sysctl
  when: devmachine_tailscale_exit_node | bool

- name: Reload the tailscale sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
  when: devmachine_tailscale_sysctl is changed
  changed_when: false
