---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# macOS ships curl, tar and unzip. Homebrew would also refuse the root this
# play runs as on a Mac reached over SSH.
- name: Install what the installer downloads with
  ansible.builtin.package:
    name:
      # The installer downloads itself with curl.
      - curl
    state: present
  when: ansible_facts['system'] != 'Darwin'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
# So every task below that runs as the account asks first, and a dry run
# reports nothing about work an apply would have created the account for.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_sentry_home }}"
  register: devmachine_sentry_account
  check_mode: false

# Into the account's own ~/.local/bin, so two workspaces can sit on different
# versions without arguing, and neither needs root to move.
- name: Install the Sentry CLI
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_sentry_home }}"
    SENTRY_INSTALL_DIR: "{{ devmachine_sentry_home }}/.local/bin"
    SENTRY_CLI_NO_TELEMETRY: "1"
  ansible.builtin.shell:
    cmd: curl -fsSL https://cli.sentry.dev/install | bash
    creates: "{{ devmachine_sentry_home }}/.local/bin/sentry"
  when: not ansible_check_mode or devmachine_sentry_account.stat.exists

# ~/.devmachine/shellenv is read by every shell, interactive or not. Other
# packages write this same block under the same marker, and writing it twice
# costs nothing: blockinfile finds it already there.
- name: Put the account's own tools on the PATH
  ansible.builtin.blockinfile:
    path: "{{ devmachine_sentry_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — ~/.local/bin on PATH"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) PATH="$HOME/.local/bin:$PATH" ;;
      esac
      export PATH

- name: Take the line an older release wrote out of ~/.zshenv
  ansible.builtin.lineinfile:
    path: "{{ devmachine_sentry_home }}/.zshenv"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: absent
