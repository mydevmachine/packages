---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Keep password login off on macOS
  ansible.builtin.import_tasks: Darwin.yml
  when: ansible_facts['system'] == 'Darwin'

- name: Keep password login off on Linux
  when: ansible_facts['system'] != 'Darwin'
  block:
    # 00- so it wins by alphabetical order over the other drop-ins, for example the
    # 50-cloud-init.conf that a cloud image ships with PasswordAuthentication yes.
    # sshd uses the first value it finds for each directive — the Include of
    # sshd_config.d sits at the top of the main sshd_config, so whatever comes first
    # in the alphabetical glob is in charge.
    - name: Turn off password authentication and root login by password
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-devmachine-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          PermitRootLogin prohibit-password
          # SSH forwards TERM and nothing else. A program on the machine that wants
          # to know which terminal it is talking to needs the rest listed here, and
          # SendEnv on the client.
          AcceptEnv TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM
      notify: Reload sshd

    # sshd -t refuses to parse anything without its privilege separation directory.
    # systemd makes /run/sshd only when ssh.service starts, and on a release that
    # starts sshd through ssh.socket — Ubuntu 24.04 and later — it may never have
    # started: a machine reached only through Tailscale SSH never opens the socket.
    - name: Make sshd's runtime directory, which the check needs
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"
      changed_when: false

    - name: Check the sshd config before it is reloaded
      ansible.builtin.command: sshd -t
      changed_when: false
