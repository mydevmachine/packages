---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

- name: Install zsh and what Oh My Zsh's installer needs
  ansible.builtin.package:
    name: "{{ devmachine_zsh_packages }}"
    state: present
  when:
    - devmachine_zsh_packages | length > 0
    - ansible_facts['pkg_mgr'] != 'homebrew'

# Homebrew refuses to run as root, and root is what this play runs as on a Mac
# reached over SSH, so the install becomes the account that owns Homebrew.
- name: Find who owns Homebrew
  ansible.builtin.stat:
    path: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}/bin/brew"
  register: devmachine_zsh_brew
  when: ansible_facts['pkg_mgr'] == 'homebrew'

- name: Find which Homebrew packages are missing
  ansible.builtin.command:
    argv: "{{ [devmachine_zsh_brew.stat.path, 'list', '--formula', '--versions'] + devmachine_zsh_packages }}"
  register: devmachine_zsh_brew_listed
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ devmachine_zsh_brew.stat.uid != ansible_facts['effective_user_id'] }}"
  become_user: "{{ devmachine_zsh_brew.stat.pw_name }}"
  when:
    - devmachine_zsh_packages | length > 0
    - ansible_facts['pkg_mgr'] == 'homebrew'

# A brew with old code fails on today's formulae (e.g. "unknown keyword"). Update
# only when something is missing, so a sync with nothing to install stays unchanged.
- name: Update Homebrew before installing
  ansible.builtin.command:
    argv: ["{{ devmachine_zsh_brew.stat.path }}", update]
  changed_when: false
  become: "{{ devmachine_zsh_brew.stat.uid != ansible_facts['effective_user_id'] }}"
  become_user: "{{ devmachine_zsh_brew.stat.pw_name }}"
  when:
    - not ansible_check_mode
    - devmachine_zsh_brew_listed is not skipped
    - devmachine_zsh_packages | map('regex_replace', '^.*/', '') | difference(devmachine_zsh_brew_listed.stdout_lines | default([]) | map('regex_replace', ' .*$', '')) | length > 0

- name: Install tmux from Homebrew
  community.general.homebrew:
    name: "{{ devmachine_zsh_packages }}"
    state: present
  become: "{{ devmachine_zsh_brew.stat.uid != ansible_facts['effective_user_id'] }}"
  become_user: "{{ devmachine_zsh_brew.stat.pw_name }}"
  when:
    - devmachine_zsh_packages | length > 0
    - ansible_facts['pkg_mgr'] == 'homebrew'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
# So every task below that runs as the account asks first, and a dry run
# reports nothing about work an apply would have created the account for.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_zsh_home }}"
  register: devmachine_zsh_account
  check_mode: false

- name: Make zsh the account's login shell
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
    shell: "{{ devmachine_zsh_shell }}"

# KEEP_ZSHRC is no on purpose: the installer writes the .zshrc everything below
# then adds to. RUNZSH is no because the installer otherwise ends by opening a
# shell and waiting for somebody who is not there.
- name: Install Oh My Zsh
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_zsh_home }}"
    RUNZSH: "no"
    KEEP_ZSHRC: "no"
  ansible.builtin.shell:
    cmd: >-
      sh -c "$(curl -fsSL
      https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
    creates: "{{ devmachine_zsh_home }}/.oh-my-zsh"
  when: not ansible_check_mode or devmachine_zsh_account.stat.exists

# The workspace's secrets and, on a Mac, the package manager's PATH (which the
# tmux below needs) now come from ~/.devmachine/shellenv, which the workspace
# package writes for every shell. An older release wrote them here.
- name: Take the blocks shellenv now holds out of ~/.zshenv
  ansible.builtin.blockinfile:
    path: "{{ devmachine_zsh_home }}/.zshenv"
    marker: "{{ devmachine_zsh_old_marker }}"
    state: absent
  loop:
    - "# {mark} devmachine — workspace secrets"
    - "# {mark} devmachine — package manager on PATH"
  loop_control:
    loop_var: devmachine_zsh_old_marker
  # A dry run for an account a real sync has yet to create has no ~/.zshenv.
  when: not ansible_check_mode or devmachine_zsh_account.stat.exists

# A connection that drops loses nothing, because the work was never in the
# connection. The second branch is what stops a new SSH login from stealing the
# screen of one that is already attached: it gets a session of its own instead.
- name: Attach to tmux on an SSH login
  ansible.builtin.blockinfile:
    path: "{{ devmachine_zsh_home }}/.zshrc"
    marker: "# {mark} devmachine — tmux auto-attach"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      if [ -z "$TMUX" ] && [ -n "$SSH_CONNECTION" ] && command -v tmux >/dev/null 2>&1; then
        if tmux has-session -t main 2>/dev/null && [ -n "$(tmux list-clients -t main 2>/dev/null)" ]; then
          exec tmux new-session -s "ssh-$$"
        else
          exec tmux new-session -A -s main
        fi
      fi
  when: devmachine_zsh_tmux_auto_attach | bool

# A tmux server reads its configuration when it starts and never again. A
# server that was already running when this was written keeps the old
# behaviour until somebody runs `tmux source-file ~/.tmux.conf`, or until every
# session on it is gone. That is not something this package can do for you: it
# would mean reaching into a session somebody is working in.
- name: Configure tmux for the account
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ devmachine_zsh_home }}/.tmux.conf"
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
  when: devmachine_zsh_tmux_config | bool
