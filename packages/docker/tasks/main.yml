---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Add Docker's own repository on Debian and Ubuntu
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.package:
    name: "{{ devmachine_docker_packages }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode
