---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Remove the old and conflicting docker packages
  ansible.builtin.package:
    name: "{{ devmachine_docker_conflicting_packages }}"
    state: absent

- name: Create the keyring directory
  ansible.builtin.file:
    path: "{{ devmachine_docker_keyring | dirname }}"
    state: directory
    mode: "0755"

- name: Download Docker's own signing key
  ansible.builtin.get_url:
    url: "{{ devmachine_docker_key_url }}"
    dest: "{{ devmachine_docker_keyring }}"
    mode: "0644"

- name: Add Docker's own repository
  ansible.builtin.copy:
    dest: "{{ devmachine_docker_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ devmachine_docker_repo_line }}\n"
  register: devmachine_docker_repo

- name: Refresh the package cache
  ansible.builtin.command: "{{ devmachine_package_cache_command }}"
  register: devmachine_docker_cache
  changed_when: false
  failed_when:
    - devmachine_docker_cache.rc != 0
    - devmachine_docker_cache.stderr_lines | select('match', '^E:') | reject('search', devmachine_package_cache_tolerated) | list | length > 0
  when: devmachine_docker_repo is changed

- name: Warn that the cache refresh skipped Caddy's repository
  ansible.builtin.debug:
    msg: >-
      WARNING: apt refused Caddy's repository while refreshing the package
      cache, because it cannot check its signature. This is Caddy's problem,
      not this machine's: see https://github.com/caddyserver/dist/issues/130.
      Every other repository was refreshed.
  when:
    - devmachine_docker_cache.rc is defined
    - devmachine_docker_cache.rc != 0

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.package:
    name: "{{ devmachine_docker_packages }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  # A dry run on a machine that does not have the package yet cannot start a
  # service that does not exist, so check mode would report a failure that only
  # means "this is not installed" — which the rest of the run already said.
  when: not ansible_check_mode
