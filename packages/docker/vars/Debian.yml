---
devmachine_package_cache_command: apt-get update

# The one repository whose errors a cache refresh lets through, as long as
# they are the only ones. Caddy signs it with a subkey its own published key
# lists as expired (https://github.com/caddyserver/dist/issues/130), so apt
# refuses it; the caddy package decides what to install instead.
devmachine_package_cache_tolerated: dl\.cloudsmith\.io/public/caddy/

devmachine_docker_keyring: /etc/apt/keyrings/docker.asc
devmachine_docker_repo_file: /etc/apt/sources.list.d/docker.list

# Docker publishes one tree per distribution, so Debian and Ubuntu do not share
# a path. `ansible_facts['distribution']` is what tells them apart.
# A system built on one of them, such as Linux Mint or Pop!_OS, has no tree of
# its own: it uses its base's, under the release name its /etc/os-release gives
# in UBUNTU_CODENAME or DEBIAN_CODENAME.
devmachine_docker_own_tree: "{{ ansible_facts['distribution'] in ['Debian', 'Ubuntu'] }}"
devmachine_docker_os_release: "{{ devmachine_docker_os_release_file.content | default('') | b64decode }}"
devmachine_docker_ubuntu_codename: >-
  {{ devmachine_docker_os_release | regex_findall('(?m)^UBUNTU_CODENAME="?([^"\s]+)') | first | default('') }}
devmachine_docker_debian_codename: >-
  {{ devmachine_docker_os_release | regex_findall('(?m)^DEBIAN_CODENAME="?([^"\s]+)') | first | default('') }}
devmachine_docker_repo_distro: >-
  {{ ansible_facts['distribution'] | lower if devmachine_docker_own_tree | bool
     else 'ubuntu' if devmachine_docker_ubuntu_codename
     else 'debian' if devmachine_docker_debian_codename
     else '' }}
devmachine_docker_repo_codename: >-
  {{ ansible_facts['distribution_release'] if devmachine_docker_own_tree | bool
     else devmachine_docker_ubuntu_codename or devmachine_docker_debian_codename }}
devmachine_docker_key_url: "https://download.docker.com/linux/{{ devmachine_docker_repo_distro }}/gpg"
# Debian names architectures its own way, and it is not what uname reports:
# x86_64 is amd64 and aarch64 is arm64. A repository line carrying the uname
# spelling matches no packages at all, and apt says only "no candidate".
devmachine_debian_architectures:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
devmachine_debian_architecture: "{{ devmachine_debian_architectures.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"

devmachine_docker_repo_line: >-
  deb [arch={{ devmachine_debian_architecture }}
  signed-by={{ devmachine_docker_keyring }}]
  https://download.docker.com/linux/{{ devmachine_docker_repo_distro }}
  {{ devmachine_docker_repo_codename }} stable

devmachine_docker_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - podman-docker
  - containerd
  - runc

devmachine_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
