format: 1
name: cline
scope: workspace
category: Coding agents
summary: >-
  The Cline CLI for one account, installed with the account's own Node.
  Logging in is a person's job, once, in each account.

needs: [workspace, dev]

requires:
  cli: ">= 0.4.0"

credentials:
  # scope: workspace because provider accounts usually differ between
  # workspaces. shareable: true because the providers file is keys and tokens
  # in a file: a copy of it works on another account.
  - name: cline
    kind: manual
    scope: workspace
    shareable: true
    command: cline auth
    stored_at: ~/.cline/data/settings/providers.json

variables:
  home:
    summary: Where the account's home is.
    default: <the account's own home>
