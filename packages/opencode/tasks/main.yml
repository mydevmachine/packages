---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# macOS ships curl, tar and unzip. Homebrew would also refuse the root this
# play runs as on a Mac reached over SSH.
- name: Install what the installer downloads with
  ansible.builtin.package:
    name:
      # The installer downloads with curl and unpacks with tar.
      - curl
      - tar
    state: present
  when: ansible_facts['system'] != 'Darwin'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_opencode_home }}"
  register: devmachine_opencode_account
  check_mode: false

# --no-modify-path: the PATH line goes to shellenv below, where every shell reads
# it, rather than to whichever startup file the installer guesses.
- name: Install the opencode CLI
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_opencode_home }}"
  ansible.builtin.shell:
    cmd: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
    creates: "{{ devmachine_opencode_home }}/.opencode/bin/opencode"
  when: not ansible_check_mode or devmachine_opencode_account.stat.exists

# ~/.devmachine/shellenv is read by every shell, interactive or not.
- name: Put opencode on the PATH
  ansible.builtin.blockinfile:
    path: "{{ devmachine_opencode_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — opencode on PATH"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      case ":$PATH:" in
        *":$HOME/.opencode/bin:"*) ;;
        *) PATH="$HOME/.opencode/bin:$PATH" ;;
      esac
      export PATH

- name: Take the line an older release wrote out of ~/.zshenv
  ansible.builtin.lineinfile:
    path: "{{ devmachine_opencode_home }}/.zshenv"
    line: 'export PATH="$HOME/.opencode/bin:$PATH"'
    state: absent
