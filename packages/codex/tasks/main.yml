---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# macOS ships curl, tar and unzip. Homebrew would also refuse the root this
# play runs as on a Mac reached over SSH.
- name: Install what the installer downloads with
  ansible.builtin.package:
    name:
      # The installer downloads with curl and unpacks with tar.
      - curl
      - tar
    state: present
  when: ansible_facts['system'] != 'Darwin'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_codex_home }}"
  register: devmachine_codex_account
  check_mode: false

# The installer has no flag to leave the PATH alone: it skips the edit only
# when ~/.local/bin is already on it, so it is, and the line goes to shellenv
# below rather than to whichever startup file the installer guesses.
# CODEX_NON_INTERACTIVE stops it asking to start Codex at the end. Codex
# updates itself from then on, so this runs once per account.
- name: Install the Codex CLI
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_codex_home }}"
    PATH: "{{ devmachine_codex_home }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    CODEX_NON_INTERACTIVE: "1"
  ansible.builtin.shell:
    cmd: curl -fsSL https://chatgpt.com/codex/install.sh | sh
    creates: "{{ devmachine_codex_home }}/.local/bin/codex"
  when: not ansible_check_mode or devmachine_codex_account.stat.exists

# ~/.devmachine/shellenv is read by every shell, interactive or not. Other
# packages write this same block under the same marker, and writing it twice
# costs nothing: blockinfile finds it already there.
- name: Put the account's own tools on the PATH
  ansible.builtin.blockinfile:
    path: "{{ devmachine_codex_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — ~/.local/bin on PATH"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) PATH="$HOME/.local/bin:$PATH" ;;
      esac
      export PATH

- name: Take the line an older release wrote out of ~/.zshenv
  ansible.builtin.lineinfile:
    path: "{{ devmachine_codex_home }}/.zshenv"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: absent
