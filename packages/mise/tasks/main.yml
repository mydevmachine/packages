---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# macOS ships curl, tar and unzip. Homebrew would also refuse the root this
# play runs as on a Mac reached over SSH.
- name: Install what mise's installer downloads with
  ansible.builtin.package:
    name:
      # mise's installer downloads itself with curl.
      - curl
    state: present
  when: ansible_facts['system'] != 'Darwin'

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
# So every task below that runs as the account asks first, and a dry run
# reports nothing about work an apply would have created the account for.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_mise_home }}"
  register: devmachine_mise_account
  check_mode: false

- name: Install mise
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_mise_home }}"
  ansible.builtin.shell:
    cmd: curl -fsSL https://mise.run | sh
    creates: "{{ devmachine_mise_home }}/.local/bin/mise"
  when: not ansible_check_mode or devmachine_mise_account.stat.exists

# ~/.devmachine/shellenv, which every shell reads, interactive or not, and not
# an interactive file like .zshrc: there `ssh machine 'mise ...'` — and
# everything a tool runs the same way, Ansible included — would not find mise
# at all. This was got wrong once: mise worked when a person typed it and
# vanished for every non-interactive command. zsh and bash get mise's own hook;
# a shell mise has no hook for gets its shims on the PATH instead.
- name: Activate mise in every shell
  ansible.builtin.blockinfile:
    path: "{{ devmachine_mise_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — mise"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      if [ -x "$HOME/.local/bin/mise" ]; then
        if [ -n "${ZSH_VERSION-}" ]; then
          eval "$("$HOME/.local/bin/mise" activate zsh)"
        elif [ -n "${BASH_VERSION-}" ]; then
          eval "$("$HOME/.local/bin/mise" activate bash)"
        else
          case ":$PATH:" in
            *":$HOME/.local/share/mise/shims:"*) ;;
            *) PATH="$HOME/.local/share/mise/shims:$PATH" ;;
          esac
          export PATH
        fi
      fi

- name: Take the line an older release wrote out of ~/.zshenv
  ansible.builtin.lineinfile:
    path: "{{ devmachine_mise_home }}/.zshenv"
    line: 'eval "$(~/.local/bin/mise activate zsh)"'
    state: absent
