---
# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
# So every task below that runs as the account asks first, and a dry run
# reports nothing about work an apply would have created the account for.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_claude_remote_control_home }}"
  register: devmachine_claude_remote_control_account
  check_mode: false

- name: Look for this account's Claude login
  ansible.builtin.stat:
    path: "{{ devmachine_claude_remote_control_home }}/.claude/.credentials.json"
  register: devmachine_claude_remote_control_login
  check_mode: false

- name: Say why the session is not started
  ansible.builtin.debug:
    msg: >-
      Nobody has logged in as {{ devmachine_workspace.user }} yet, so there is
      no session to connect. Run `devmachine login {{ devmachine_workspace.name }}/claude`,
      then sync again.
  when:
    - devmachine_claude_remote_control_account.stat.exists
    - not devmachine_claude_remote_control_login.stat.exists

- name: Keep the session up through systemd
  ansible.builtin.import_tasks: Linux.yml
  when: ansible_facts['system'] == 'Linux'

- name: Keep the session up through launchd
  ansible.builtin.import_tasks: Darwin.yml
  when: ansible_facts['system'] == 'Darwin'
