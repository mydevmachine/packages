---
devmachine_claude_remote_control_home: "{{ devmachine_account.home | default(('/Users/' if ansible_facts['system'] == 'Darwin' else '/home/') ~ devmachine_workspace.user) }}"

# Empty means the workspace's name. Two workspaces both running this otherwise
# appear in the phone app under names nothing tells apart.
devmachine_claude_remote_control_session_name: ""

devmachine_claude_remote_control_working_directory: "{{ devmachine_claude_remote_control_home }}/dev"

devmachine_claude_remote_control_restart_seconds: 30

# One launch daemon per account, so two workspaces on one Mac never share a label.
devmachine_claude_remote_control_label: "devmachine.claude-rc.{{ devmachine_workspace.user }}"
devmachine_claude_remote_control_plist: "/Library/LaunchDaemons/{{ devmachine_claude_remote_control_label }}.plist"
