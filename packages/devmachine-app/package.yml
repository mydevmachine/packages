format: 1
name: devmachine-app
scope: machine
category: macOS
summary: What the Devmachine macOS app asks a machine for, reached through `devmachine run --package devmachine-app`.

requires:
  cli: ">= 0.9.0"

variables:
  github_hosts:
    summary: >-
      GitHub Enterprise hosts the context panel resolves pull requests on,
      each as `{host, proxy}` with `proxy` optional. github.com always works;
      this adds more.
    default: []

entrypoint: bin/devmachine-app
commands: [context, stats, caddy-logs]
providers:
  stats:
    returns: {collected_at: string, memory: object, swap: object, disk: object, load: object, docker: object, users: list, ports: list, errors: list}
    min_every: 10s

widgets: widgets
