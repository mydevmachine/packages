format: 1
name: usage
summary: One coding harness's usage windows, how much of each is used and when it resets.
requires: {engine: ">= 1.5"}
fits: [canvas, stack]
context: {}
inputs:
  harness: {type: choice, from: harnesses, summary: Which coding harness to show.}
source:
  kind: provider
  name: app/harness-usage
  with: {harness: "{{inputs.harness}}"}
  every: 60s
view: {kind: app.harness-usage}
sizes: [small, medium, wide]
default_size: medium
places: [home]
