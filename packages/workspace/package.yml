format: 1
name: workspace
scope: workspace
category: Foundation
summary: >-
  The account a person works in: a home nobody else can read, a git
  identity, ~/dev, and one environment every shell of the account reads.

requires:
  cli: ">= 0.9.0"

variables:
  home:
    summary: >-
      Where the account's home is. It is read from the account; a new account
      gets /home/<the account> unless this says otherwise. On macOS a new
      account always gets /Users/<the account>.
    default: <the account's own home>
  admin_home:
    summary: >-
      The home of the account the CLI provisions with. Whatever reaches that
      account over SSH is what reaches this workspace. It is read from the
      system: root's home, or the admin login's own when that is not root.
    default: <the admin login's own home>
  groups:
    summary: >-
      Extra groups the account joins. The docker group is one of them and it
      is effectively root, so nobody joins it by accident.
    default: []
  shell:
    summary: >-
      The login shell. Empty means the system's default for a new account
      (useradd's on Linux, /bin/bash on macOS), and the package that installs
      a shell is the one that sets it.
    default: ""
  git_name:
    summary: The name on this workspace's commits.
    default: ""
  git_email:
    summary: The address on this workspace's commits.
    default: ""
  sign_commits:
    summary: Sign every commit and rebase, once a package such as git-key sets up a key.
    default: true
  known_hosts:
    summary: >-
      The hosts whose SSH host key is trusted in advance, so the first clone
      does not stop to ask a question nobody is there to answer.
    default: ["github.com"]
  repos:
    summary: >-
      Repositories cloned into ~/dev/<name>, once. A clone is never pulled,
      reset or removed afterwards, and a folder already at ~/dev/<name> is left
      as it is. A clone over SSH waits for the workspace's key, which a package
      such as git-key delivers after this one runs, so it happens on the second
      pass of the same sync.
    type: list
    default: []
    items:
      fields:
        name:
          summary: The folder under ~/dev. Letters, digits, dot, dash and underscore.
          required: true
        url:
          summary: Where it is cloned from, over SSH or HTTPS.
          required: true
        branch:
          summary: The branch checked out on the clone. Left out, the remote's default.
