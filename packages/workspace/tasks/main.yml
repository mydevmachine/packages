---
# A loop over first_found, not a plain include_vars: when no file matches, the
# loop is empty and the task skips, on ansible-core 2.14 as on the latest.
- name: Load the names for this system
  ansible.builtin.include_vars: "{{ devmachine_vars_file }}"
  loop: "{{ query('ansible.builtin.first_found', devmachine_vars_chain) }}"
  loop_control:
    loop_var: devmachine_vars_file
  vars:
    devmachine_vars_chain:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['pkg_mgr'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
      skip: true

# check_mode makes the user module only read: it never creates the account,
# and a missing one just leaves no home in the result.
- name: Read the account's home and group
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
  check_mode: true
  changed_when: false
  register: devmachine_account

# A dry run on a machine where this account does not exist yet cannot become
# it: Ansible has no user to hand its temporary files to, and fails saying so.
# So every task below that runs as the account asks first, and a dry run
# reports nothing about work an apply would have created the account for.
- name: Look for the account
  ansible.builtin.stat:
    path: "{{ devmachine_workspace_home }}"
  register: devmachine_workspace_account
  check_mode: false

# Once per run, not once per workspace: every workspace package installs
# something, and a cache refresh each time would cost more than it buys.
- name: Refresh the package cache
  ansible.builtin.command: "{{ devmachine_package_cache_command }}"
  register: devmachine_workspace_cache
  changed_when: false
  failed_when:
    - devmachine_workspace_cache.rc != 0
    - devmachine_workspace_cache.stderr_lines | select('match', '^E:') | reject('search', devmachine_package_cache_tolerated) | list | length > 0
  when:
    - devmachine_package_cache_command is defined
    - devmachine_workspace_cache_refreshed is not defined

- name: Warn that the cache refresh skipped Caddy's repository
  ansible.builtin.debug:
    msg: >-
      WARNING: apt refused Caddy's repository while refreshing the package
      cache, because it cannot check its signature. This is Caddy's problem,
      not this machine's: see https://github.com/caddyserver/dist/issues/130.
      Every other repository was refreshed.
  when:
    - devmachine_workspace_cache.rc is defined
    - devmachine_workspace_cache.rc != 0
    - devmachine_workspace_cache_refreshed is not defined

- name: Remember the cache has been refreshed in this run
  ansible.builtin.set_fact:
    devmachine_workspace_cache_refreshed: true

- name: Install what an account needs before anybody logs into it
  ansible.builtin.package:
    name: "{{ devmachine_workspace_packages }}"
    state: present
  when: devmachine_workspace_packages | length > 0

- name: Install the workspace account creator
  ansible.builtin.copy:
    src: devmachine-create-workspace
    dest: /usr/local/sbin/devmachine-create-workspace
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['system'] != 'Darwin'

# Docker Engine uses the host daemon and the docker group. These accounts do
# not run rootless containers, so allocating a 65,536-ID subordinate range to
# every workspace buys nothing. More importantly, VM images may reserve the
# remaining subordinate-ID space for their bootstrap account, causing useradd
# to fail after only a handful of workspaces.
- name: Create the account without an unused subordinate ID range
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/devmachine-create-workspace
      - "{{ devmachine_workspace.user }}"
      - "{{ devmachine_workspace_home }}"
  register: devmachine_workspace_created
  changed_when: "'created' in devmachine_workspace_created.stdout_lines"
  when:
    - not ansible_check_mode
    # macOS has no useradd and no subordinate IDs: the task below creates it.
    - ansible_facts['system'] != 'Darwin'

# A configuration written for Linux often carries `groups: [docker]`, and a Mac
# has no docker group: the docker package gives each workspace a VM of its own
# there instead. A group macOS does not have is left out rather than failing.
- name: Look for each group on macOS
  ansible.builtin.command:
    argv: [dscl, ., -read, "/Groups/{{ item }}", RecordName]
  loop: "{{ devmachine_workspace_groups }}"
  register: devmachine_workspace_mac_groups
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Darwin'

- name: Say which groups macOS does not have
  ansible.builtin.debug:
    msg: >-
      {{ devmachine_workspace.user }} joins no {{ item }} group: macOS has
      none{{ ', and Docker reaches this workspace through a VM of its own instead' if item == 'docker' else '' }}.
  loop: "{{ devmachine_workspace_groups | difference(devmachine_workspace_joined_groups) }}"

- name: Create the account
  ansible.builtin.user:
    name: "{{ devmachine_workspace.user }}"
    groups: "{{ devmachine_workspace_joined_groups | default(omit, true) }}"
    # ansible-core 2.21 refuses append without groups; older ones only warned.
    append: "{{ true if devmachine_workspace_joined_groups | length > 0 else omit }}"
    # Left out unless somebody asks for one. Setting a shell here would fight
    # the package that installs one: each run would change it back, and both
    # tasks would report a change forever.
    shell: "{{ devmachine_workspace_shell | default(omit, true) }}"
    create_home: true
    # Off the login window and out of System Settings: nobody logs into a
    # workspace at the Mac's own screen.
    hidden: "{{ true if ansible_facts['system'] == 'Darwin' else omit }}"
  register: devmachine_account

- name: Say the account comes with a real sync
  ansible.builtin.debug:
    msg: >-
      {{ devmachine_workspace.user }} does not exist yet. A real sync creates
      it; this dry run skips what would go into its home.
  when:
    - ansible_check_mode
    - devmachine_account.home is not defined

# With Remote Login set to "Only these users", sshd lets in only members of
# this group, and refuses a new account with "failed service ACL check".
- name: Let the account in through Remote Login
  when: ansible_facts['system'] == 'Darwin'
  block:
    - name: Look for the Remote Login access group
      ansible.builtin.command: dscl . -read /Groups/com.apple.access_ssh RecordName
      register: devmachine_workspace_ssh_group
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ask whether the account is in it
      ansible.builtin.command:
        argv: [dseditgroup, -o, checkmember, -m, "{{ devmachine_workspace.user }}", com.apple.access_ssh]
      register: devmachine_workspace_ssh_member
      changed_when: false
      failed_when: false
      check_mode: false
      when: devmachine_workspace_ssh_group.rc == 0

    - name: Add the account to it
      ansible.builtin.command:
        argv: [dseditgroup, -o, edit, -a, "{{ devmachine_workspace.user }}", -t, user, com.apple.access_ssh]
      changed_when: true
      when:
        - devmachine_workspace_ssh_group.rc == 0
        - devmachine_workspace_ssh_member.rc != 0

# This is the whole isolation model: one workspace cannot read another's home.
# It is also why delivering a credential into a home is safe enough — nothing
# else on the machine can open it.
- name: Keep the home readable by its owner only
  ansible.builtin.file:
    path: "{{ devmachine_workspace_home }}"
    state: directory
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0750"

- name: Create ~/.ssh
  ansible.builtin.file:
    path: "{{ devmachine_workspace_home }}/.ssh"
    state: directory
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0700"

# On a Mac reached over SSH the admin login is not root: it runs the play
# through sudo, and sudo names it in SUDO_USER on this side of the connection.
- name: Read the administrative account's home
  ansible.builtin.user:
    name: "{{ lookup('ansible.builtin.env', 'SUDO_USER') | default(ansible_facts['user_id'], true) }}"
  check_mode: true
  changed_when: false
  register: devmachine_workspace_admin_account
  when: ansible_facts['system'] == 'Darwin'

- name: Look for the keys the administrative account is reached by
  ansible.builtin.stat:
    path: "{{ devmachine_workspace_admin_home }}/.ssh/authorized_keys"
  register: devmachine_workspace_admin_keys_file

- name: Read them
  ansible.builtin.slurp:
    src: "{{ devmachine_workspace_admin_home }}/.ssh/authorized_keys"
  register: devmachine_workspace_admin_keys
  when: devmachine_workspace_admin_keys_file.stat.exists

# `exclusive: false`, and it is not an oversight. Taking a key out of a list
# does not revoke it: an apply from a stale copy of the configuration would
# otherwise lock the operator out of every account at once. Revoking is a
# separate and deliberate act.
- name: Authorise those keys on this account
  ansible.posix.authorized_key:
    user: "{{ devmachine_workspace.user }}"
    key: "{{ devmachine_workspace_key }}"
    # The path is spelled out because a dry run on a machine that has no such
    # account yet cannot look one up, and would fail saying so. ~/.ssh was made
    # above, so the module has no directory to manage.
    path: "{{ devmachine_workspace_home }}/.ssh/authorized_keys"
    manage_dir: false
    exclusive: false
    state: present
  loop: >-
    {{ (devmachine_workspace_admin_keys.content | default('') | b64decode).splitlines()
       | map('trim') | reject('equalto', '') | reject('match', '#') | list }}
  loop_control:
    # Never `item`. The generated playbook runs this role in a loop of its own,
    # and `devmachine_workspace` is that loop's `item` — so an inner loop named
    # the same way silently rebinds the workspace this whole role is about.
    loop_var: devmachine_workspace_key
    label: "{{ devmachine_workspace_key.split(' ') | last }}"

- name: Trust the host key of each forge this workspace talks to
  ansible.builtin.command: "ssh-keyscan -t ed25519 {{ devmachine_workspace_forge | quote }}"
  register: devmachine_workspace_host_keys
  loop: "{{ devmachine_workspace_known_hosts }}"
  loop_control:
    loop_var: devmachine_workspace_forge
  changed_when: false
  failed_when: false
  check_mode: false

- name: Write them into the account's known_hosts
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  ansible.builtin.known_hosts:
    path: "{{ devmachine_workspace_home }}/.ssh/known_hosts"
    name: "{{ devmachine_workspace_scan.devmachine_workspace_forge }}"
    # OpenSSH 10 prints its "# host:22 SSH-2.0-..." comment on stdout, not
    # stderr; a key with it never matches the file and changes every run.
    key: "{{ devmachine_workspace_scan.stdout_lines | reject('match', '#') | join('\n') }}"
    state: present
  loop: "{{ devmachine_workspace_host_keys.results | default([]) }}"
  loop_control:
    loop_var: devmachine_workspace_scan
    label: "{{ devmachine_workspace_scan.devmachine_workspace_forge }}"
  when:
    - devmachine_workspace_scan.stdout | default('') | length > 0
    - not ansible_check_mode or devmachine_workspace_account.stat.exists

- name: Set the git identity
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_workspace_home }}"
  community.general.git_config:
    name: "{{ devmachine_workspace_setting.name }}"
    value: "{{ devmachine_workspace_setting.value }}"
    scope: global
  loop:
    - {name: user.name, value: "{{ devmachine_workspace_git_name }}"}
    - {name: user.email, value: "{{ devmachine_workspace_git_email }}"}
  loop_control:
    loop_var: devmachine_workspace_setting
    label: "{{ devmachine_workspace_setting.name }}"
  when:
    - devmachine_workspace_setting.value | length > 0
    - not ansible_check_mode or devmachine_workspace_account.stat.exists

- name: Enable commit and rebase signing
  become: true
  become_user: "{{ devmachine_workspace.user }}"
  environment:
    HOME: "{{ devmachine_workspace_home }}"
  community.general.git_config:
    name: "{{ devmachine_workspace_setting.name }}"
    value: "{{ devmachine_workspace_setting.value }}"
    scope: global
  loop:
    - {name: commit.gpgsign, value: "true"}
    - {name: rebase.gpgSign, value: "true"}
  loop_control:
    loop_var: devmachine_workspace_setting
    label: "{{ devmachine_workspace_setting.name }}"
  when:
    - devmachine_workspace_sign_commits | bool
    - not ansible_check_mode or devmachine_workspace_account.stat.exists

- name: Create ~/dev
  ansible.builtin.file:
    path: "{{ devmachine_workspace_home }}/dev"
    state: directory
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0755"

# The CLI delivers the workspace's secrets into this directory and keeps it at
# 0700 itself, so any other mode here would be undone on every push.
- name: Create ~/.devmachine
  ansible.builtin.file:
    path: "{{ devmachine_workspace_home }}/.devmachine"
    state: directory
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0700"

# ~/.devmachine/shellenv holds what every shell of the account needs, whichever
# shell it is, so it is POSIX sh only. Each package writes a block of its own.
- name: Put the package manager on the account's PATH
  ansible.builtin.blockinfile:
    path: "{{ devmachine_workspace_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — package manager on PATH"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      for devmachine_dir in {{ devmachine_workspace_path_prefix | reverse | join(' ') }}; do
        case ":$PATH:" in
          *":$devmachine_dir:"*) ;;
          *) PATH="$devmachine_dir:$PATH" ;;
        esac
      done
      unset devmachine_dir
      export PATH
  when: devmachine_workspace_path_prefix | length > 0

# `devmachine secrets set NAME --workspace <ws>` delivers into ~/.devmachine/env.
- name: Load the workspace's secrets in every shell
  ansible.builtin.blockinfile:
    path: "{{ devmachine_workspace_home }}/.devmachine/shellenv"
    marker: "# {mark} devmachine — workspace secrets"
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      if [ -r "$HOME/.devmachine/env" ]; then
        set -a
        . "$HOME/.devmachine/env"
        set +a
      fi

# Never created: a new ~/.bash_profile would hide the ~/.profile a login bash
# reads when there is none, and on Debian and Ubuntu that ~/.profile is what
# runs ~/.bashrc.
- name: Look for ~/.bash_profile
  ansible.builtin.stat:
    path: "{{ devmachine_workspace_home }}/.bash_profile"
  register: devmachine_workspace_bash_profile
  check_mode: false

# zsh reads ~/.zshenv in every shell and sh a login ~/.profile. bash reads
# ~/.bashrc when it is not a login, or over ssh with a command, and a login one
# ~/.bash_profile, or ~/.profile when there is none. At the top, because the
# ~/.bashrc of Debian, Ubuntu and Arch returns at once in a shell that is not
# interactive. The variable is not exported on purpose: a login bash reads two
# of these files and must load shellenv once, but a shell it starts inherits
# none of its functions or hooks, so it has to load shellenv again.
- name: Read ~/.devmachine/shellenv from every shell's startup files
  ansible.builtin.blockinfile:
    path: "{{ devmachine_workspace_home }}/{{ devmachine_workspace_startup_file }}"
    marker: "# {mark} devmachine — shell environment"
    insertbefore: BOF
    create: true
    owner: "{{ devmachine_workspace.user }}"
    group: "{{ devmachine_account.group | default(omit) }}"
    mode: "0644"
    block: |
      if [ -z "${devmachine_shellenv_loaded-}" ] && [ -r "$HOME/.devmachine/shellenv" ]; then
        devmachine_shellenv_loaded=1
        . "$HOME/.devmachine/shellenv"
      fi
  loop: "{{ ['.zshenv', '.bashrc', '.profile'] + (['.bash_profile'] if devmachine_workspace_bash_profile.stat.exists else []) }}"
  loop_control:
    # Never `item`: the generated playbook already uses it for the workspace
    # this role is running for.
    loop_var: devmachine_workspace_startup_file
