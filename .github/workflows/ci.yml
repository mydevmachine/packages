name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The asset is named after the repository, not the binary: GoReleaser
      # builds `cli_<version>_linux_amd64.tar.gz` out of `mydevmachine/devmachine`.
      - name: Install the CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mydevmachine/devmachine \
            --pattern 'devmachine_*_linux_amd64.tar.gz' --output /tmp/cli.tar.gz --clobber
          tar -xzf /tmp/cli.tar.gz -C /tmp devmachine
          sudo install /tmp/devmachine /usr/local/bin/devmachine
          devmachine version

      # The validator is the format. This is how the repository stays inside it.
      - name: Validate every recipe
        run: ./scripts/validate.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The providers ship their own Python tests. A provider whose tests
      # only run on somebody's laptop is a provider whose tests stop running.
      - name: Run every provider's tests
        run: python3 -m unittest discover -s packages -p 'test_*.py' -v

      # devmachine-app's tests are pytest-style (fixtures, monkeypatch) and
      # `unittest discover` above collects none of them.
      - name: Install pytest
        run: pipx install pytest

      - name: Run devmachine-app's tests
        run: pytest -q packages/devmachine-app/test

      # macOS ships Python 3.9, and a Mac reached as a self machine runs the
      # entrypoint with it: syntax newer than 3.9 breaks there and nowhere else.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run devmachine-app's tests on Python 3.9
        run: python3.9 -m pip install --quiet pytest && python3.9 -m pytest -q packages/devmachine-app/test

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Ansible
        run: pipx install ansible-core

      # A recipe that does not parse cannot be caught by the validator, which
      # reads package.yml and the task files as text rather than as a play.
      - name: Check every recipe parses as a role
        run: ./scripts/syntax-check.sh

      - name: Check workspace account creation
        run: ./scripts/test-workspace-account.sh

  # The oldest Ansible a machine runs: Debian 12's own, ansible-core 2.14. A
  # recipe that uses anything newer breaks every Debian 12 sync.
  syntax-debian-12:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install Ansible as Debian 12 ships it
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ansible git ca-certificates

      - uses: actions/checkout@v5

      - name: Check every recipe parses as a role
        run: ./scripts/syntax-check.sh

  # Arch's own Ansible, the one an Arch machine runs.
  syntax-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Ansible as Arch ships it
        run: pacman -Syu --noconfirm ansible git

      - uses: actions/checkout@v5

      - name: Check every recipe parses as a role
        run: ./scripts/syntax-check.sh

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pattern list lives outside the repository, so this passes on a
      # runner and bites on the maintainer's machine, which is where the risk
      # is.
      - name: Check for real data
        run: ./scripts/check-no-real-data.sh

  skill-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The skills carry a verbatim copy of the CLI's own docs, so an agent
      # can operate the CLI offline. This checks that copy against the CLI's
      # latest release, not its main branch, since a release is what ships.
      - name: Fetch the CLI's latest release docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$(gh release view --repo mydevmachine/devmachine --json tagName -q .tagName)"
          gh repo clone mydevmachine/devmachine /tmp/cli-docs -- --depth 1 --branch "$tag"

      - name: Check the skill references are in sync
        run: |
          set -e
          ./scripts/sync-skill-references.sh \
            /tmp/cli-docs/docs --check || {
            echo "::error::skill references are out of date. Run" \
              "'scripts/sync-skill-references.sh <cli-docs-checkout>' and commit the result."
            exit 1
          }
